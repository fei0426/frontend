# =========================================================
# 校园通 StudyPal-AI —— Nginx 配置
# 任务四：动静分离 + 反向代理 + 正向代理
#   80  端口：静态站点（Vue 打包产物）+ /api 反向代理到 Spring Boot
#   8888 端口：HTTP 正向代理（浏览器/curl 主动把请求交给它转发）
#
# 换电脑 / 换目录时不用手改下面的 root：
#   在本仓库根目录执行  powershell -ExecutionPolicy Bypass -File .\deploy\setup-nginx.ps1 -NginxHome D:\nginx
#   脚本会自动构建前端并把 root 改成本机 dist 的绝对路径
# =========================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ---------- gzip：文本类静态资源压缩后再发给浏览器 ----------
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # =======================================================
    # 一、主站点：动静分离（80 端口）
    # =======================================================
    server {
        listen       80;
        server_name  localhost 127.0.0.1;

        # 静态资源根目录 = 前端 npm run build 的产物（setup-nginx.ps1 会自动改写这一行）
        root   D:/xzai/frontend/dist;
        index  index.html;

        access_log  logs/studypal.access.log;
        error_log   logs/studypal.error.log;

        # ---------- 1. 动态请求：反向代理到 Spring Boot ----------
        # 浏览器只认识 nginx，由 nginx 代表后端接收请求（反向代理）
        location /api/ {
            proxy_pass         http://127.0.0.1:10086;
            proxy_http_version 1.1;

            # 把真实客户端信息透传给后端，否则后端只能看到 127.0.0.1
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 支持 WebSocket（聊天接口用得到）
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # 文件上传大小与超时（与后端 50MB 上传上限匹配）
            client_max_body_size 60m;
            proxy_read_timeout   300s;
        }

        # ---------- 2. 带 hash 的构建产物：nginx 直接返回 + 长缓存 ----------
        location /assets/ {
            # 文件名带 hash，内容变化必然改名，可以放心长缓存
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ---------- 3. 单页应用兜底（前端用的是 hash 路由） ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------- 4. 动静分离演示：纯静态小文件由 nginx 直接吐 ----------
        location = /static-demo.txt {
            default_type text/plain;
            return 200 "Hello from Nginx static file (no Java involved)\n";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # =======================================================
    # 二、正向代理（8888 端口）
    # 客户端主动配置代理服务器，nginx 替客户端去访问外网
    # 用法：curl -x http://127.0.0.1:8888 http://example.com/
    # 注意：只支持 http；https 需要 stream 模块的 CONNECT，这里不展开
    # =======================================================
    server {
        listen       8888;
        server_name  localhost;

        # 用 DNS 解析目标域名
        resolver 114.114.114.114 223.5.5.5 valid=60s ipv6=off;

        access_log  logs/proxy.access.log;

        location / {
            # $http_host 是客户端请求头里的目标主机，$request_uri 是原始路径
            proxy_pass          http://$http_host$request_uri;
            proxy_set_header    Host $http_host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_buffers 256 4k;
        }
    }
}
